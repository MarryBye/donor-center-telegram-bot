[project]
name = "donor-center-telegram-bot"
version = "1.0.0"
description = "Kharkiv Donor Center Telegram Bot for donor registration, appointment booking, and blood supply tracking"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Viktor Lukianov", email = "marrybyee@gmail.com" }
]
dependencies = [
    "aiocache>=0.12.3",
    "aiogram>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "F403",  # star imports in handler registers
    "F405",  # star import names
    "F811",  # handler redefinition pattern common in aiogram router files
    "E741",  # ambiguous variable name 'O' used for blood group O
    "UP031", # percent formatting
    "B008",  # function call in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
